name: ARIF Spatial Data Collection

on:
  schedule:
    - cron: '5 * * * *'  # Una vez por hora (Minutos :05)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libnspr4 \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libasound2
    
    - name: Install dependencies
      run: |
        pip install pandas requests playwright beautifulsoup4
        playwright install chromium --with-deps
    
    - name: Run spatial collector
      run: python arif_spatial_collector.py
    
    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/ logs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update ARIF spatial data $(date -u +"%Y-%m-%d %H:%M UTC")"
        git push
      continue-on-error: true
