name: ARIF Spatial Data Collection

on:
  schedule:
    - cron: '5,35 * * * *'  # Dos veces por hora
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pandas requests playwright beautifulsoup4
        playwright install chromium
    
    - name: Run spatial collector
      run: python arif_spatial_collector.py
    
    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/ logs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update ARIF spatial data $(date -u +"%Y-%m-%d %H:%M UTC")"
        git push
      continue-on-error: true
    
    - name: Upload debug artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: arif-debug-logs
        path: |
          logs/
